# cp.example.com（福彩数据与预测平台）nginx 站点配置
# 安装：
#   cp deploy/nginx.conf /www/server/panel/vhost/nginx/cp.example.com.conf   （宝塔）
#   或 cp deploy/nginx.conf /etc/nginx/conf.d/cp.example.com.conf            （原生 nginx）
#   证书：acme.sh --issue -d cp.example.com --webroot /www/wwwroot/cp.example.com --keylength ec-256
#         acme.sh --install-cert -d cp.example.com --ecc \
#           --key-file /etc/letsencrypt/live/cp.example.com/privkey.pem \
#           --fullchain-file /etc/letsencrypt/live/cp.example.com/fullchain.pem \
#           --reloadcmd "nginx -s reload"
# 注意：安全响应头由 FastAPI 中间件（app/ratelimit.py）统一下发，
#       这里不要再写一遍，否则响应里会出现重复头。

server {
    listen 80;
    server_name cp.example.com;

    # acme.sh webroot 校验目录必须留在 80 段
    location /.well-known/acme-challenge/ {
        root /www/wwwroot/cp.example.com;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name cp.example.com;

    ssl_certificate     /etc/letsencrypt/live/cp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cp.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 4m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # SSE 同步进度：必须关闭缓冲，否则进度条不动
    location /api/sync/stream {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 预测 / 回测 / 导出 CSV 都是长任务
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 前端静态资源 + SPA 兜底都由 FastAPI 提供
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
